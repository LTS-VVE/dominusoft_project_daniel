{% if page.has_other_pages %}
<nav class="pager" aria-label="Faqet">
    {% if page.has_previous %}<a class="btn btn-outline-light btn-sm square-btn" href="?{{ extra }}{% if extra %}&amp;{% endif %}page={{ page.previous_page_number }}">&larr; Para</a>{% else %}<span></span>{% endif %}
    <span class="muted-copy">Faqja {{ page.number }} nga {{ page.paginator.num_pages }}</span>
    {% if page.has_next %}<a class="btn btn-outline-light btn-sm square-btn" href="?{{ extra }}{% if extra %}&amp;{% endif %}page={{ page.next_page_number }}">Pas &rarr;</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
