<form method="get" class="site-form mb-4 col-lg-6">
  {% if request.GET.view %}<input type="hidden" name="view" value="{{ request.GET.view }}">{% endif %}
  {% if request.GET.sort %}<input type="hidden" name="sort" value="{{ request.GET.sort }}">{% endif %}
  <div class="d-flex gap-2">
    <input class="form-control" type="search" name="q" value="{{ search }}" aria-label="Search" placeholder="/ Search {{ source.label|lower }}" {% if not source.search_fields %}disabled{% endif %}>
    <button class="btn btn-outline-secondary">Search</button>
  </div>
</form>
