{% extends "dataviewer/base.html" %}
{% block dv_title %}{{ source.label }}{% endblock %}
{% block dv_content %}
<div class="dv-head">
  <div class="me-auto">
    <p class="dv-count mb-1">{{ total }} found</p>
    <h1 class="section-title mb-0">{{ source.label }}</h1>
  </div>
  <a class="btn btn-sm btn-outline-secondary" href="{% url 'dataviewer:model_detail' source.key %}">Structure</a>
</div>
{% include "dataviewer/blocks/_search.html" %}
{% include "dataviewer/blocks/_block.html" with interactive=True %}
{% endblock %}
